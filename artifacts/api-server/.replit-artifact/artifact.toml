kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
# Install the Python bot engine's dependencies, then build the Node API server.
args = ["bash", "-c", "pip install -r artifacts/tradebuzz-bot-engine/requirements.txt && pnpm --filter @workspace/api-server run build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# Launch the Python bot engine (port 8001, /engine) and the Node API server (/api)
# together. The Node server proxies authenticated requests to the bot engine.
args = ["bash", "artifacts/api-server/start-prod.sh"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
BOT_ENGINE_URL = "http://localhost:8001"

[services.production.health.startup]
path = "/api/healthz"
